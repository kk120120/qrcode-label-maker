# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: create win 64 exe

on:
  workflow_dispatch:  # 仅手动运行，不自动触发

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write  # 允许写入仓库内容

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: 安装项目依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 提取版本号
        id: get_version
        run: |
          $version = (Select-String -Path "main.py" -Pattern 'VERSION = "(.*?)"').Matches.Groups[1].Value
          echo "version=$version" >> $env:GITHUB_ENV
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: 用 spec 文件打包 EXE
        run: |
          pyinstaller qr-label-creator.spec

      - name: 创建 released 目录（如果不存在）
        run: |
          if (-not (Test-Path "released")) {
            New-Item -ItemType Directory -Path "released" -Force
          }

      - name: 复制并重命名打包文件到 released 目录
        run: |
          $version = $env:version
          $date = Get-Date -Format "yyyy.MM.dd"
          $sourcePath = "dist\qr-label-creator.exe"
          $destPath = "released\qrcode-label-creator-$version-$date.exe"
          Copy-Item -Path $sourcePath -Destination $destPath -Force
          # 创建压缩包（包含 exe 文件）
          Compress-Archive -Path $destPath -DestinationPath "released\qrcode-label-creator-$version-$date.zip" -Force

      - name: 提交 released 文件夹到仓库
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add released/
          git commit -m "Auto: Build and release qrcode-label-creator ${{ steps.get_version.outputs.VERSION }}" || echo "No changes to commit"
          git push

      - name: 上传生成的程序
        uses: actions/upload-artifact@v4
        with:
          name: QR-Label-Creator-Windows
          path: released/
