name: create win 64 exe

on:
  workflow_dispatch:  # 仅手动运行，不自动触发
  push:
    tags:
      - 'v*'  # 当推送以 v 开头的 tag 时自动运行

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: 'pip'

      - name: 安装项目依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 用 spec 文件打包 EXE
        run: |
          pyinstaller qr-label-creator.spec

      - name: 创建 release 目录并重命名 EXE
        id: rename-exe
        run: |
          $VERSION = (Select-String -Path "app_info.py" -Pattern "^VERSION").Line -replace ".*=\s*['""]*", "" -replace "['""]*$", ""
          $VERSION = $VERSION.Trim()
          New-Item -ItemType Directory -Path "release" -Force | Out-Null
          $NEW_NAME = "qr-label-creator-$VERSION.exe"
          Move-Item -Path "dist/qr-label-creator.exe" -Destination "release/$NEW_NAME"
          Write-Host "Created: $NEW_NAME"
          Write-Host "VERSION=$VERSION" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "EXE_NAME=$NEW_NAME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 创建 GitHub Release (仅 tag 触发时)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/${{ env.EXE_NAME }}
          name: Release v${{ env.VERSION }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
