# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: create win 64 exe

on:
  workflow_dispatch:  # 仅手动运行，不自动触发

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: 安装项目依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 用 spec 文件打包 EXE
        run: |
          pyinstaller qr-label-creator.spec

      - name: 创建 released 目录
        run: |
          New-Item -ItemType Directory -Path "released" -Force

      - name: 复制打包文件到 released 目录
        run: |
          Copy-Item -Path "dist/*" -Destination "released/" -Recurse -Force

      - name: 上传生成的程序
        uses: actions/upload-artifact@v4
        with:
          name: QR-Label-Creator-Windows
          path: released/
