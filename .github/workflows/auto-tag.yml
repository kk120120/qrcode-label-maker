name: Release & Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          pip list

      - name: 查看目录结构
        run: |
          dir
          Get-ChildItem -Recurse | Select-Object FullName

      - name: 打包 EXE
        run: |
          pyinstaller qr-label-creator.spec
        continue-on-error: false

      - name: 检查打包结果
        run: |
          Write-Host "=== 检查 dist 目录 ==="
          if (Test-Path "dist") {
            dir dist
          } else {
            Write-Host "dist 目录不存在"
            exit 1
          }
          
          Write-Host "=== 检查 EXE 文件 ==="
          $exePath = "dist/qr-label-creator.exe"
          if (Test-Path $exePath) {
            Write-Host "✅ EXE 文件存在: $exePath"
            $file = Get-Item $exePath
            Write-Host "文件大小: $($file.Length / 1MB) MB"
          } else {
            Write-Host "❌ EXE 文件不存在!"
            exit 1
          }

      - name: 提取版本号
        id: version
        shell: bash
        run: |
          VERSION=$(grep "^VERSION" app_info.py | cut -d'"' -f2)
          echo "当前版本号: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 创建 release 目录并重命名
        id: rename
        run: |
          $VERSION = "${{ steps.version.outputs.version }}"
          Write-Host "版本号: $VERSION"
          
          New-Item -ItemType Directory -Path "release" -Force | Out-Null
          $NEW_NAME = "qr-label-creator-$VERSION.exe"
          $SOURCE = "dist/qr-label-creator.exe"
          $DEST = "release/$NEW_NAME"
          
          Write-Host "移动文件: $SOURCE -> $DEST"
          Move-Item -Path $SOURCE -Destination $DEST -Force
          
          Write-Host "=== 检查 release 目录 ==="
          dir release
          
          Write-Host "VERSION=$VERSION" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "EXE_NAME=$NEW_NAME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          
          Write-Host "设置环境变量: VERSION=$VERSION, EXE_NAME=$NEW_NAME"

      - name: 创建 Git Tag
        shell: bash
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a "${{ steps.version.outputs.version }}" -m "Release ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"
          echo "✅ 已创建并推送 tag"

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/${{ env.EXE_NAME }}
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
