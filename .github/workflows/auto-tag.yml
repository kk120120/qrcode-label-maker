name: Release & Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 提取版本号
        id: version
        shell: bash
        run: |
          VERSION=$(grep "^VERSION" app_info.py | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 打包 EXE
        run: |
          pyinstaller qr-label-creator.spec

      - name: 检查打包结果
        run: |
          if (-not (Test-Path "dist/qr-label-creator.exe")) {
            echo "❌ EXE 文件未生成!"
            exit 1
          }
          echo "✅ EXE 文件已生成"

      - name: 创建 releases 目录并打包
        id: package
        run: |
          $VERSION = "${{ steps.version.outputs.version }}"
          Write-Host "版本号: $VERSION"
          
          $RELEASES_DIR = "releases/$VERSION"
          New-Item -ItemType Directory -Path $RELEASES_DIR -Force | Out-Null
          
          $ZIP_NAME = "qr-label-creator-$VERSION.zip"
          $ZIP_PATH = "$RELEASES_DIR/$ZIP_NAME"
          
          Compress-Archive -Path "dist/qr-label-creator.exe" -DestinationPath $ZIP_PATH -Force
          Write-Host "创建 ZIP: $ZIP_PATH"
          
          Remove-Item -Path "dist/qr-label-creator.exe" -Force
          
          Write-Host "=== releases 目录内容 ==="
          dir $RELEASES_DIR
          
          echo "ZIP_PATH=$ZIP_PATH" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: 创建 Git Tag
        shell: bash
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a "${{ steps.version.outputs.version }}" -m "Release ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.ZIP_PATH }}
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
